<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Gemini AI Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-box {
      width: 400px;
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 15px;
      white-space: pre-wrap;
      background: #f1f1f1;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="chat-box">
  <h3>Gemini AI</h3>
  <textarea id="prompt" placeholder="Nhập câu hỏi..."></textarea>
  <button onclick="send()">Gửi</button>
  <div class="result" id="result"></div>
</div>

<script>
  const API_KEY = "AIzaSyBiCOH4SjHLbMf2-TN52MZqMTbq_ve7V4o"; // ❌ Không để key thật khi deploy

  async function send() {
    const prompt = document.getElementById("prompt").value;
    const resultBox = document.getElementById("result");

    resultBox.innerText = "Đang trả lời...";

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ]
          })
        }
      );

      const data = await response.json();
      resultBox.innerText =
        data.candidates?.[0]?.content?.parts?.[0]?.text || "Không có phản hồi";
    } catch (error) {
      resultBox.innerText = "Lỗi: " + error.message;
    }
  }
</script>

</body>
</html>
