<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="login_form.css">
</head>
<body>
    <div class="container">

    <!-- Avatar -->
    <div class="avatar">
        <img src="image/tải xuống (1).jpg" alt="Avatar">
    </div>

    <!-- FORM -->
    <form class="login-box" action="#" method="post">

        <h2>Flat Business Profile Widget</h2>

        <input 
            type="text" 
            name="username" 
            placeholder="Name" 
            required
        >

        <input 
            type="password" 
            name="password" 
            placeholder="Password" 
            required
        >

        <button type="submit">Submit</button>

    </form>

    <p class="copyright">
        © 2016 Flat Business Profile Widget. All rights reserved
    </p>

</div>

</body>
</html>
